# PostgreSQL для EventApi — файл из задания пятого спринта.
# Локальная поправка: порт хоста 5433, поскольку 5432 уже занят.
# Для подключения из приложения используйте Host=localhost;Port=5433.
# Запуск из корня репозитория: docker compose up -d
# Остановка: docker compose down
# Данные сохраняются в именованном томе eventapi_pgdata

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventapi
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - eventapi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventapi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  eventapi_pgdata:
